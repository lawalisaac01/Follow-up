<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Follow Up Studio</title>
  <style>
    :root{
      --bg:#faf7f1;
      --card:#ffffff;
      --ink:#2b2a28;
      --muted:#8a8577;
      --accent:#7a6ff0;
      --accent-soft:#efeeff;
      --ok:#3fb27f;
      --due:#e8a53b;
      --overdue:#e2604f;
      --border:#eee8db;
      --radius:16px;
    }
    * { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--bg);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      padding-bottom:80px;
    }
    /* Center content and give it breathing room on tablets/desktops */
    header, .tabs, .search-wrap, main {
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }
    header{
      position:sticky; top:0; z-index:10;
      background:var(--bg);
      padding:18px 16px 10px;
      border-bottom:1px solid var(--border);
    }
    header h1{
      font-size:clamp(18px, 4vw, 22px); margin:0 0 2px;
      letter-spacing:.2px;
    }
    header p{margin:0;color:var(--muted);font-size:13px;}

    .tabs{
      display:flex; gap:6px; overflow-x:auto; padding:12px 16px 0;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{display:none;}
    .tab{
      flex:0 0 auto; padding:8px 14px; border-radius:999px;
      background:var(--card); border:1px solid var(--border);
      font-size:13px; color:var(--muted); white-space:nowrap;
      cursor:pointer; transition:background .15s, color .15s, border-color .15s;
    }
    .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
    .tab:active{transform:scale(.96);}

    .search-wrap{
      position:sticky; top:64px; z-index:9;
      background:var(--bg);
      display:flex; align-items:center; gap:8px;
      padding:10px 16px 4px;
    }
    .search-icon{font-size:14px;position:absolute;margin-left:12px;pointer-events:none;opacity:.6;}
    .search-input{
      width:100%; padding:11px 34px 11px 34px; border-radius:12px;
      border:1px solid var(--border); background:var(--card); font-size:14px;
      color:var(--ink);
    }
    .search-input:focus{outline:none;border-color:var(--accent);}
    .clear-search{
      position:absolute; margin-left:calc(100% - 46px); background:none; border:none;
      color:var(--muted); font-size:14px; padding:6px;
    }

    main{padding:14px 16px;}
    .section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px;}

    /* Responsive contact grid: 1 column on phones, 2 on tablets, 3 on wide screens */
    #contactGrid{
      display:grid; grid-template-columns:1fr; gap:10px;
    }
    @media (min-width: 620px){
      header, .tabs, .search-wrap, main { max-width: 960px; }
      #contactGrid{ grid-template-columns:1fr 1fr; }
    }
    @media (min-width: 980px){
      header, .tabs, .search-wrap, main { max-width: 1180px; }
      #contactGrid{ grid-template-columns:1fr 1fr 1fr; }
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px;
      display:flex; align-items:center; gap:12px;
      cursor:pointer;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    }
    .card:hover{box-shadow:0 4px 14px rgba(20,18,15,.06);border-color:#e3ddcb;}
    .card:active{transform:scale(.985);}
    .avatar{
      width:46px;height:46px;border-radius:50%;
      background:var(--accent-soft); color:var(--accent);
      display:flex;align-items:center;justify-content:center;
      font-weight:600; font-size:16px; flex:0 0 auto;
      overflow:hidden;
    }
    .card-body{flex:1; min-width:0;}
    .card-body .name{font-weight:600; font-size:15px; overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .card-body .meta{font-size:12px;color:var(--muted); margin-top:2px;}
    .badge{
      font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600;
      white-space:nowrap;
    }
    .badge.ok{background:#e6f7ef;color:var(--ok);}
    .badge.due-soon{background:#fdf2e0;color:var(--due);}
    .badge.overdue{background:#fbe9e6;color:var(--overdue);}
    .streak{font-size:11px;color:var(--accent);margin-top:2px;}

    mark{background:#fff1b8;color:inherit;border-radius:3px;padding:0 1px;}

    /* Skeleton loading state */
    .skeleton-card{
      background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
      padding:14px; display:flex; align-items:center; gap:12px;
    }
    .sk-avatar, .sk-line{
      background:linear-gradient(90deg, var(--border) 25%, #f5f1e6 37%, var(--border) 63%);
      background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:8px;
    }
    .sk-avatar{width:46px;height:46px;border-radius:50%;flex:0 0 auto;}
    .sk-line{height:12px;margin-bottom:6px;width:70%;}
    .sk-line.short{width:40%;}
    @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}

    .fab{
      position:fixed; right:18px; bottom:22px;
      width:56px;height:56px;border-radius:50%;
      background:var(--accent); color:#fff; border:none;
      font-size:28px; box-shadow:0 6px 16px rgba(122,111,240,.4);
      display:flex;align-items:center;justify-content:center;
      transition:transform .12s ease;
    }
    .fab:active{transform:scale(.92);}
    @media (min-width: 980px){
      .fab{ right:calc((100vw - 1180px)/2 + 18px); }
    }

    .sheet-overlay{
      position:fixed; inset:0; background:rgba(20,18,15,.4);
      display:none; align-items:flex-end; z-index:50;
    }
    .sheet-overlay.open{display:flex;}
    .sheet{
      background:var(--bg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
      border-radius:20px 20px 0 0; padding:18px 18px 28px;
      animation:up .18s ease-out;
    }
    @media (min-width: 620px){
      .sheet-overlay{ align-items:center; }
      .sheet{ border-radius:20px; max-height:82vh; }
    }
    @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    .sheet h2{margin:0 0 14px;font-size:18px;}
    .sheet-close{float:right;background:none;border:none;font-size:20px;color:var(--muted);}

    label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;}
    input,select,textarea{
      width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
      background:#fff; font-size:14px; color:var(--ink);
    }
    textarea{resize:vertical;min-height:60px;}

    .actions-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
    .btn{
      flex:1; padding:11px; border-radius:10px; border:none;
      font-size:13px; font-weight:600; text-align:center; text-decoration:none;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .btn-primary{background:var(--accent); color:#fff;}
    .btn-secondary{background:var(--accent-soft); color:var(--accent);}
    .btn-call{background:#e6f7ef;color:var(--ok);}
    .btn-wa{background:#e3f7ea;color:#25a35a;}
    .btn-sms{background:#eef2fd;color:#4a6cf7;}
    .btn-mail{background:#fdf2e0;color:#c98a1a;}
    .btn-block{width:100%;margin-top:14px;}

    .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;}
    .log-item{border-bottom:1px solid var(--border);padding:8px 0;font-size:13px;}
    .log-item .occ{font-weight:600;}
    .log-item .d{color:var(--muted);font-size:11px;}

    .file-btn{
      display:block; text-align:center; padding:11px; border-radius:10px;
      background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600;
      border:1px dashed var(--accent);
    }
    .loading{text-align:center;padding:40px 10px;color:var(--muted);font-size:13px;}
    .toast{
      position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
      background:#2b2a28; color:#fff; padding:10px 18px; border-radius:999px;
      font-size:13px; z-index:99; opacity:0; transition:opacity .25s;
    }
    .toast.show{opacity:1;}
  </style>
</head>
<body>

  <header>
    <h1>💜 Follow Up Studio</h1>
    <p id="subtitle">Loading your people…</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="all">All</div>
    <div class="tab" data-tab="overdue">Overdue</div>
    <div class="tab" data-tab="Close Relative">Close Relatives</div>
    <div class="tab" data-tab="Immediate Family">Family</div>
    <div class="tab" data-tab="Friend">Friends</div>
    <div class="tab" data-tab="birthdays">Birthdays</div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="searchBox" class="search-input" type="search" placeholder="Search by name, phone, or email…" oninput="onSearch(this.value)">
    <button id="clearSearch" class="clear-search" style="display:none" onclick="clearSearch()">✕</button>
  </div>

  <main id="main">
    <div id="contactGrid">
      <div class="skeleton-card"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="skeleton-card"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="skeleton-card"><div class="sk-avatar"></div><div style="flex:1"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
    </div>
  </main>

  <button class="fab" onclick="openAddSheet()">＋</button>

  <!-- Contact detail sheet -->
  <div class="sheet-overlay" id="detailOverlay">
    <div class="sheet">
      <button class="sheet-close" onclick="closeSheet('detailOverlay')">✕</button>
      <h2 id="d-name">Name</h2>
      <div class="meta" id="d-meta" style="color:var(--muted);font-size:13px;margin-bottom:8px;"></div>

      <div class="actions-row">
        <a class="btn btn-call" id="d-call">📞 Call</a>
        <a class="btn btn-wa" id="d-wa">💬 WhatsApp</a>
        <a class="btn btn-sms" id="d-sms">✉️ SMS</a>
        <a class="btn btn-mail" id="d-mail">📧 Email</a>
      </div>

      <label>Occasion</label>
      <select id="d-occasion" onchange="loadTemplates()"></select>

      <label>Message template <span id="d-tpl-count" style="color:var(--accent);"></span></label>
      <select id="d-template" onchange="applyTemplate()"><option value="">— pick a template or write your own below —</option></select>

      <label>Notes / message to send</label>
      <textarea id="d-notes" placeholder="e.g. Called to check in, talked about her exam results"></textarea>

      <div id="d-photo-wrap" style="display:none;margin-top:12px;">
        <label>Photo (from Drive) — long-press to save, then attach to WhatsApp Status</label>
        <img id="d-photo" style="width:100%;border-radius:12px;display:block;" />
      </div>

      <div class="actions-row">
        <button class="btn btn-secondary" onclick="copyMessage()">📋 Copy message</button>
        <a class="btn btn-wa" id="d-wa-send" target="_blank">💬 Open WhatsApp chat</a>
      </div>

      <button class="btn btn-primary btn-block" onclick="submitLog()">✅ Log this follow-up</button>

      <div class="section-title">History</div>
      <div id="d-log"></div>
    </div>
  </div>

  <!-- Add contact / import sheet -->
  <div class="sheet-overlay" id="addOverlay">
    <div class="sheet">
      <button class="sheet-close" onclick="closeSheet('addOverlay')">✕</button>
      <h2>Add someone</h2>

      <label>Import from .vcf (contacts export — pick as many files as you like at once)</label>
      <input type="file" id="vcfFile" accept=".vcf" multiple style="display:none" onchange="handleVCF(this)">
      <div class="file-btn" onclick="document.getElementById('vcfFile').click()">📇 Upload VCF file(s)</div>
      <div id="vcfProgress" style="font-size:12px;color:var(--muted);margin-top:6px;text-align:center;"></div>

      <div class="section-title">Or add manually</div>
      <label>Name</label>
      <input id="a-name" placeholder="Full name">
      <label>Phone</label>
      <input id="a-phone" placeholder="+234...">
      <label>Email</label>
      <input id="a-email" placeholder="name@email.com">
      <label>Category</label>
      <select id="a-category">
        <option>Close Relative</option>
        <option>Immediate Family</option>
        <option selected>Friend</option>
      </select>
      <label>Birthday</label>
      <input id="a-birthday" type="date">

      <button class="btn btn-primary btn-block" onclick="submitAdd()">Save contact</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ⚠️ PASTE YOUR APPS SCRIPT WEB APP URL HERE (Deploy → New deployment → Web app → copy the URL)
    const API_URL = "https://script.google.com/macros/s/AKfycbxCHC9g-ZMoZ8MJ8BhHFvYJElxtktesMz2kmsGrZJwy4hy33rKVPu1m9BqRCEHQ9u6WBw/exec";

    function apiGet(action, params = {}) {
      const qs = new URLSearchParams({ action, ...params }).toString();
      return fetch(`${API_URL}?${qs}`)
        .then(r => r.json())
        .then(res => { if (!res.ok) throw new Error(res.error); return res.data; });
    }

    function apiPost(action, payload = {}) {
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight
        body: JSON.stringify({ action, payload })
      })
        .then(r => r.json())
        .then(res => { if (!res.ok) throw new Error(res.error); return res.data; });
    }

    let ALL_CONTACTS = [];
    let CURRENT_TAB = 'all';
    let SELECTED_ID = null;
    let SEARCH_TERM = '';

    function toast(msg){
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 1800);
    }

    function init(){
      apiGet('getContacts').then(onContacts).catch(err => toast('Error: ' + err.message));
      apiGet('getOccasions').then(list=>{
        const sel = document.getElementById('d-occasion');
        sel.innerHTML = list.map(o=>`<option>${o}</option>`).join('');
      }).catch(err => toast('Error: ' + err.message));
    }

    function onContacts(contacts){
      ALL_CONTACTS = contacts;
      document.getElementById('subtitle').textContent = contacts.length + ' people you\'re staying close to';
      render();
    }

    function initials(name){
      return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
    }

    function highlight(text){
      if (!SEARCH_TERM || !text) return text || '';
      const idx = text.toLowerCase().indexOf(SEARCH_TERM.toLowerCase());
      if (idx === -1) return text;
      return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+SEARCH_TERM.length) + '</mark>' + text.slice(idx+SEARCH_TERM.length);
    }

    function onSearch(val){
      SEARCH_TERM = val.trim();
      document.getElementById('clearSearch').style.display = SEARCH_TERM ? 'block' : 'none';
      render();
    }
    function clearSearch(){
      SEARCH_TERM = '';
      document.getElementById('searchBox').value = '';
      document.getElementById('clearSearch').style.display = 'none';
      render();
    }

    function render(){
      const main = document.getElementById('main');
      let list = ALL_CONTACTS;

      if (CURRENT_TAB === 'overdue') list = list.filter(c=>c.status==='overdue');
      else if (CURRENT_TAB === 'birthdays') { renderBirthdays(); return; }
      else if (CURRENT_TAB !== 'all') list = list.filter(c=>c.category===CURRENT_TAB);

      if (SEARCH_TERM){
        const q = SEARCH_TERM.toLowerCase();
        list = list.filter(c =>
          (c.name && c.name.toLowerCase().includes(q)) ||
          (c.phone && c.phone.toLowerCase().includes(q)) ||
          (c.email && c.email.toLowerCase().includes(q))
        );
      }

      if (!list.length){
        main.innerHTML = `<div class="empty">${SEARCH_TERM ? 'No matches for "'+SEARCH_TERM+'"' : 'Nobody here yet. Tap ＋ to add someone.'}</div>`;
        return;
      }

      main.innerHTML = `<div id="contactGrid">` + list.map(c => `
        <div class="card" onclick="openDetail('${c.id}')">
          <div class="avatar">${c.photoUrl ? `<img src="${c.photoUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : initials(c.name)}</div>
          <div class="card-body">
            <div class="name">${highlight(c.name)}</div>
            <div class="meta">${c.category} · ${c.lastContact ? c.daysSince+'d since contact' : 'never contacted'}</div>
            ${c.streak>0 ? `<div class="streak">🔥 ${c.streak} streak</div>` : ''}
          </div>
          <span class="badge ${c.status}">${c.status==='ok'?'On track':c.status==='due-soon'?'Due soon':'Overdue'}</span>
        </div>
      `).join('') + `</div>`;
    }

    function renderBirthdays(){
      apiGet('getUpcomingBirthdays').then(list=>{
        const main = document.getElementById('main');
        if (!list.length){ main.innerHTML = '<div class="empty">No birthdays saved yet.</div>'; return; }
        main.innerHTML = `<div id="contactGrid">` + list.map(c=>`
          <div class="card" onclick="openDetail('${c.id}')">
            <div class="avatar">🎂</div>
            <div class="card-body">
              <div class="name">${c.name}</div>
              <div class="meta">${c.daysAway===0?'Today!':c.daysAway+' days away'} · ${c.birthday}</div>
            </div>
          </div>
        `).join('') + `</div>`;
      }).catch(err => toast('Error: ' + err.message));
    }

    document.querySelectorAll('.tab').forEach(t=>{
      t.addEventListener('click', ()=>{
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        CURRENT_TAB = t.dataset.tab;
        render();
      });
    });

    function openDetail(id){
      const c = ALL_CONTACTS.find(x=>x.id===id) || {id:id};
      SELECTED_ID = id;
      document.getElementById('d-name').textContent = c.name || '';
      document.getElementById('d-meta').textContent = `${c.category||''} · ${c.phone||'no phone'} · ${c.email||'no email'}`;
      document.getElementById('d-call').href = c.phone ? `tel:${c.phone}` : '#';
      document.getElementById('d-wa').href = c.phone ? `https://wa.me/${c.phone.replace(/[^0-9]/g,'')}` : '#';
      document.getElementById('d-sms').href = c.phone ? `sms:${c.phone}` : '#';
      document.getElementById('d-mail').href = c.email ? `mailto:${c.email}` : '#';
      document.getElementById('d-notes').value = '';
      document.getElementById('d-template').innerHTML = '<option value="">— pick a template or write your own below —</option>';
      document.getElementById('d-tpl-count').textContent = '';

      const photoWrap = document.getElementById('d-photo-wrap');
      if (c.photoUrl) {
        photoWrap.style.display = 'block';
        document.getElementById('d-photo').src = c.photoUrl;
      } else {
        photoWrap.style.display = 'none';
      }

      document.getElementById('d-log').innerHTML = '<div class="empty">Loading…</div>';
      apiGet('getLogForContact', { id }).then(logs=>{
        document.getElementById('d-log').innerHTML = logs.length ? logs.map(l=>`
          <div class="log-item"><span class="occ">${l.occasion}</span> via ${l.channel}
            <div class="d">${l.date}${l.notes ? ' · '+l.notes : ''}</div></div>
        `).join('') : '<div class="empty">No history yet.</div>';
      }).catch(err => toast('Error: ' + err.message));

      document.getElementById('detailOverlay').classList.add('open');
      loadTemplates();
      updateWaSendLink();
    }

    function loadTemplates(){
      const occasion = document.getElementById('d-occasion').value;
      if (!occasion || !SELECTED_ID) return;
      const sel = document.getElementById('d-template');
      sel.innerHTML = '<option value="">Loading…</option>';
      apiGet('getPersonalizedMessages', { occasion, contactId: SELECTED_ID }).then(msgs=>{
        document.getElementById('d-tpl-count').textContent = msgs.length ? `(${msgs.length} available)` : '(none yet — add some in the Messages sheet)';
        sel.innerHTML = '<option value="">— pick a template or write your own below —</option>' +
          msgs.map((m,i)=>`<option value="${i}">${m.length>60?m.slice(0,60)+'…':m}</option>`).join('');
        sel.dataset.messages = JSON.stringify(msgs);
      }).catch(err => toast('Error: ' + err.message));
    }

    function applyTemplate(){
      const sel = document.getElementById('d-template');
      if (sel.value === '') return;
      const msgs = JSON.parse(sel.dataset.messages || '[]');
      document.getElementById('d-notes').value = msgs[Number(sel.value)] || '';
      updateWaSendLink();
    }

    function updateWaSendLink(){
      const c = ALL_CONTACTS.find(x=>x.id===SELECTED_ID);
      const text = document.getElementById('d-notes').value;
      const link = document.getElementById('d-wa-send');
      if (c && c.phone) {
        link.href = `https://wa.me/${c.phone.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(text)}`;
      } else {
        link.href = '#';
      }
    }
    document.getElementById('d-notes').addEventListener('input', updateWaSendLink);

    function copyMessage(){
      const text = document.getElementById('d-notes').value;
      if (!text) { toast('Nothing to copy yet'); return; }
      navigator.clipboard.writeText(text).then(()=>{
        toast('Message copied — paste it into WhatsApp Status');
      }).catch(()=> toast('Could not copy — select and copy manually'));
    }

    function closeSheet(id){ document.getElementById(id).classList.remove('open'); }

    function submitLog(){
      const c = ALL_CONTACTS.find(x=>x.id===SELECTED_ID);
      const payload = {
        contactId: SELECTED_ID,
        contactName: c ? c.name : '',
        occasion: document.getElementById('d-occasion').value,
        channel: 'Manual',
        notes: document.getElementById('d-notes').value
      };
      apiPost('logInteraction', payload).then(()=>{
        toast('Logged ✅');
        closeSheet('detailOverlay');
        init();
      }).catch(err => toast('Error: ' + err.message));
    }

    function openAddSheet(){ document.getElementById('addOverlay').classList.add('open'); }

    function submitAdd(){
      const c = {
        name: document.getElementById('a-name').value.trim(),
        phone: document.getElementById('a-phone').value.trim(),
        email: document.getElementById('a-email').value.trim(),
        category: document.getElementById('a-category').value,
        birthday: document.getElementById('a-birthday').value
      };
      if (!c.name){ toast('Name is required'); return; }
      apiPost('addContact', c).then(()=>{
        toast('Contact added');
        closeSheet('addOverlay');
        init();
      }).catch(err => toast('Error: ' + err.message));
    }

    function handleVCF(input){
      const files = Array.from(input.files || []);
      if (!files.length) return;
      const progressEl = document.getElementById('vcfProgress');
      progressEl.textContent = `Reading ${files.length} file(s)…`;

      const readers = files.map(file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsText(file);
      }));

      Promise.all(readers).then(texts => {
        progressEl.textContent = 'Importing… this can take a moment for large files.';
        return apiPost('importVCF', { texts });
      }).then(res=>{
        progressEl.textContent = '';
        toast(`${res.added} added${res.skipped ? ', ' + res.skipped + ' duplicates skipped' : ''}`);
        closeSheet('addOverlay');
        input.value = '';
        init();
      }).catch(err=>{
        progressEl.textContent = '';
        toast('Import failed: ' + err.message);
      });
    }

    init();
  </script>
</body>
</html>
